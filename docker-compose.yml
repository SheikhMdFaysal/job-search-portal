services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_DIR: /app/storage/documents
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - generated_documents:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_DIR: /app/storage/documents
    volumes:
      - ./backend:/app
      - generated_documents:/app/storage/documents
    depends_on:
      backend:
        condition: service_started
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info

  beat:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  generated_documents:
